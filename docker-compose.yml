services:
  mongo1:
    image: mongo:7.0 # Utilise l'image officielle MongoDB version 7.0
    container_name: mongo1_p8 # Nom du conteneur
    ports:
      - "28117:27017" # Expose le port 27017 du conteneur sur le port 27021 de l'hôte. Cela permet de se connecter à MongoDB depuis l'hôte.
    volumes:
      - mongo1_data:/data/db # Montage d'un volume Docker pour persister les données MongoDB. Cela permet de conserver les données MongoDB même après le redémarrage du conteneur.
    command: ["--replSet", "rs0", "--bind_ip_all"] # Commande pour initialiser le replica set. Cela permet de créer un replica set avec les trois conteneurs.

  mongo2:
    image: mongo:7.0
    container_name: mongo2_p8
    ports:
      - "28118:27017"
    volumes:
      - mongo2_data:/data/db
    command: ["--replSet", "rs0", "--bind_ip_all"]

  mongo3:
    image: mongo:7.0
    container_name: mongo3_p8
    ports:
      - "28119:27017"
    volumes:
      - mongo3_data:/data/db
    command: ["--replSet", "rs0", "--bind_ip_all"]

  python-migration:
    build: . # Build l'image Docker à partir du Dockerfile local. Cela permet de créer une image Docker à partir du Dockerfile local.
    container_name: python_migration_p8 # Nom du conteneur
    depends_on:
      - mongo1 # Dépend du conteneur mongo1. Cela permet de démarrer le conteneur mongo1 avant le conteneur python-migration.
      - mongo2 # Dépend du conteneur mongo2. Cela permet de démarrer le conteneur mongo2 avant le conteneur python-migration.
      - mongo3 # Dépend du conteneur mongo3. Cela permet de démarrer le conteneur mongo3 avant le conteneur python-migration.
    env_file:
      - .env # Charge les variables d'environnement depuis le fichier .env.
    command: python import_s3_to_mongodb_conteneur.py # Exécute le script Python qui importe les données S3 vers MongoDB. Cela permet d'exécuter le script Python qui importe les données S3 vers MongoDB.

volumes:
  mongo1_data: # Nom du volume. Cela permet de créer un volume Docker pour persister les données MongoDB.
  mongo2_data: # Nom du volume. Cela permet de créer un volume Docker pour persister les données MongoDB.
  mongo3_data: # Nom du volume. Cela permet de créer un volume Docker pour persister les données MongoDB.
